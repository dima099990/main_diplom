{% extends 'crm/base.html' %}
{% block title %}Новая продажа{% endblock %}
{% block page_title %}Новая продажа{% endblock %}
{% block content %}
<div class="page-header">
  <div><div class="breadcrumb"><a href="{% url 'crm:sale_list' %}">Продажи</a><span>›</span>Новая</div><h1>Продажа аксессуаров</h1></div>
</div>
<div class="card" style="max-width:600px">
  <p class="text-muted" style="margin-bottom:16px;font-size:13px">Данные покупателя не обязательны</p>
  <form method="post">{% csrf_token %}
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Имя покупателя</label><input name="customer_name" class="form-control" placeholder="необязательно"></div>
      <div class="form-group"><label class="form-label">Телефон</label><input name="customer_phone" class="form-control" placeholder="необязательно"></div>
    </div>
    <div class="form-group"><label class="form-label">Примечания</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
    <button type="submit" class="btn btn-primary">Создать продажу →</button>
  </form>
</div>
{% endblock %}
