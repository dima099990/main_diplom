{% load static %}
<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход в CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'crm/css/crm.css' %}">
</head><body>
<div class="login-page">
  <div class="login-box">
    <h1>{{ site.company_name }}</h1>
    <p>Вход в систему управления</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="form-group">
        <label class="form-label">Логин</label>
        <input type="text" name="username" class="form-control" autofocus required>
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:8px">Войти</button>
    </form>
  </div>
</div>
</body></html>
