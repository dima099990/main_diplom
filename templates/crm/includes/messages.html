{% if messages %}
<div class="space-y-2 mb-4">
  {% for message in messages %}
  <div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)"
       class="flex items-center gap-3 p-3 rounded-lg text-sm
       {% if message.tags == 'success' %}bg-green-500/15 text-green-300 border border-green-500/20
       {% elif message.tags == 'error' %}bg-red-500/15 text-red-300 border border-red-500/20
       {% elif message.tags == 'warning' %}bg-yellow-500/15 text-yellow-300 border border-yellow-500/20
       {% else %}bg-blue-500/15 text-blue-300 border border-blue-500/20{% endif %}">
    <span class="flex-1">{{ message }}</span>
    <button @click="show = false" class="opacity-60 hover:opacity-100 text-lg leading-none">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
